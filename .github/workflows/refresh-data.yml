name: Refresh dashboard data

on:
  schedule:
    # Scrape on the :23 minute, not :00: the top of the hour is GitHub's most
    # contended scheduler slot, where runs are most often delayed or dropped.
    # Hourly through 00:00-09:00 UTC covers the release_nightly.yml completion
    # window (nightly fires 20:15 UTC, e2e-release lands ~01:00-05:00 UTC) plus
    # the ~07:00 UTC Athens-morning check, so a dropped run never leaves more
    # than ~2h of staleness when it matters. Sparser the rest of the day, when
    # nothing new lands anyway.
    - cron: '23 0-9 * * *'
    - cron: '23 12,15,18,21 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      nightly-in-progress: ${{ steps.nightly.outputs.in-progress }}
    steps:
      - uses: actions/checkout@v4

      # Checked before scraping: a nightly that finishes during the scrape
      # was still captured half-done, so it needs a follow-up refresh too.
      - name: Check whether the release nightly is still running
        id: nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run=$(gh api 'repos/edgelesssys/contrast/actions/workflows/release_nightly.yml/runs?per_page=1' \
            --jq '.workflow_runs[0] | "\(.status) \(.created_at)"')
          read -r status created <<<"$run"
          # Ignore runs older than a day, so a stuck run can't chain forever.
          if [[ $status != completed ]] && (( $(date +%s) - $(date -d "$created" +%s) < 86400 )); then
            echo "in-progress=true" >>"$GITHUB_OUTPUT"
          fi
          echo "release_nightly: $status (created $created)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install processor deps
        run: npm install --no-audit --no-fund

      - name: Scrape + process all tiers
        env:
          # Default workflow token. Scopes are local to this repo, but it
          # still authenticates as a regular GitHub App installation against
          # the public REST endpoints we hit on edgelesssys/contrast (5000
          # req/hr quota, no SAML constraint for public-repo reads).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./contrast-local.sh fetch

      - name: Snapshot data files (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data-${{ github.run_id }}
          path: data-*.json
          retention-days: 90

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub drops most scheduled runs of this workflow, so a scrape that
  # caught the nightly mid-flight could stay up for hours. Chain refreshes
  # until one scrapes the finished run.
  follow-up:
    needs: build-and-deploy
    if: needs.build-and-deploy.outputs.nightly-in-progress == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Re-dispatch this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api 'repos/edgelesssys/contrast/actions/workflows/release_nightly.yml/runs?per_page=1' \
            --jq '.workflow_runs[0].status')
          if [[ $status != completed ]]; then
            sleep 1200
          fi
          gh workflow run refresh-data.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
